name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: idevice, POSTGRES_PASSWORD: idevice, POSTGRES_DB: idevice_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idevice" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://idevice:idevice@localhost:5432/idevice_test
      TEST_DATABASE_URL: postgresql://idevice:idevice@localhost:5432/idevice_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef
      DATA_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npm run db:constraints
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
